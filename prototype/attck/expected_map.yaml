# ATT&CK expected-detectability map (C1 coverage-gap engine).
# asset_role -> techniques that SHOULD be detectable there.
# A technique expected-but-never-observed is a supervisory finding, not a
# SOC tuning note (DeTT&CT reasoning repurposed for oversight).
# Rationale per row is inline so a supervisor can challenge or extend it.
internet-facing: [T1190, T1133]   # exploit-public-facing-app, external-remote-services
mail-gateway: [T1566]             # phishing must be seen where mail enters
ad-server: [T1003, T1078]         # credential-dumping, valid-accounts abuse
edr-covered: [T1059, T1486]       # command-shell, ransomware-class impact
db-server: [T1021]                # remote-services movement toward crown jewels
workstation: [T1059]              # scripting-interpreter abuse on endpoints
